<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · AI Job Finder</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/offline.js"></script>
</head>
<body>
  <main class="offline-wrap">
    <section class="card empty">
      <h1>You're offline</h1>
      <p>AI Job Finder can't reach the network right now. For your privacy, no job data, profile details, emails, or documents are stored for offline use.</p>
      <p>Reconnect to the internet and try again.</p>
      <div class="btn-row offline-actions">
        <button class="btn primary" id="retry" type="button">Try again</button>
      </div>
    </section>
  </main>
</body>
</html>
